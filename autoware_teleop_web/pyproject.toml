[project]
name = "autoware-teleop-web"
version = "0.1.0"
description = "FastAPI WebSocket bridge for the autoware_teleop Autoware Universe extension"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic>=2.0",
    "rclpy",
    "autoware_teleop_msgs",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "websockets"]

[tool.pytest.ini_options]
testpaths = ["test"]
